[workspace]
members = [
    "crates/provider-x-contract-probe",
    "crates/provider-x-app",
    "crates/provider-x-catalog",
    "crates/provider-x-core",
    "crates/provider-x-egress",
    "crates/provider-x-network",
    "crates/provider-x-providers",
    "crates/provider-x-protocol",
]
resolver = "3"

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.97.1"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1.0"
arc-swap = "1.9"
base64 = "0.22"
bytes = "1.10"
chrono = "0.4"
futures-util = "0.3"
fs2 = "0.4"
getrandom = "0.4"
gpui-kit = { version = "=0.6.6", default-features = false, features = ["assets"] }
# Fork fixes Button Group focus synchronization and uses the shared focus border.
gpui-omarchy = { git = "https://github.com/brookqin/gpui-omarchy", rev = "ca2552c099e784f8c79f50acc3ed52fd2a4437db" }
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1.11", features = ["client", "http1", "http2", "server"] }
hyper-http-proxy = { version = "1.1.1", default-features = false, features = ["rustls-tls-webpki-roots"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-tokio"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "server", "tokio"] }
pin-project-lite = "0.2"
png = "0.18"
rust-i18n = "=4.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml_edit = "0.25"
tower-service = "0.3"
tray-icon = { version = "=0.24.2", default-features = false }
url = "2.5"
yaml_serde = "0.10"
zstd = "0.13"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
