name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish macOS release
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          version=$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n 1)
          if [[ -z "$version" ]]; then
            echo "Could not read the workspace version from Cargo.toml" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match workspace version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust 1.97.1
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update

      - name: Build and verify app bundle
        env:
          RUSTUP_TOOLCHAIN: 1.97.1
        run: ./scripts/build-macos-app.sh

      - name: Create DMG and checksum
        id: package
        shell: bash
        run: |
          dmg_path=$(./scripts/create-macos-dmg.sh)
          dmg_dir=$(dirname "$dmg_path")
          dmg_name=$(basename "$dmg_path")
          (cd "$dmg_dir" && shasum -a 256 "$dmg_name" > "$dmg_name.sha256")
          echo "dmg_path=$dmg_path" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: release_notes
        shell: bash
        run: |
          notes_path="$RUNNER_TEMP/provider-x-release-notes.md"
          previous_tag=$(git describe \
            --tags \
            --match 'v[0-9]*' \
            --abbrev=0 \
            "$GITHUB_REF_NAME^" 2>/dev/null || true)

          if [[ -n "$previous_tag" ]]; then
            changelog_range="$previous_tag..$GITHUB_REF_NAME"
          else
            changelog_range="$GITHUB_REF_NAME"
          fi

          {
            cat <<'EOF'
          > [!IMPORTANT]
          > ProviderX is not signed with an Apple Developer certificate. After installation, run:
          >
          > ```sh
          > sudo xattr -r -d com.apple.quarantine /Applications/ProviderX.app
          > ```

          ## Changelog

          EOF
            git log "$changelog_range" \
              --no-merges \
              --format='- %s (`%h`)'
            if [[ -n "$previous_tag" ]]; then
              printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
                "$GITHUB_REPOSITORY" \
                "$previous_tag" \
                "$GITHUB_REF_NAME"
            fi
          } > "$notes_path"

          echo "notes_path=$notes_path" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DMG_PATH: ${{ steps.package.outputs.dmg_path }}
          RELEASE_NOTES_PATH: ${{ steps.release_notes.outputs.notes_path }}
        shell: bash
        run: |
          release_options=(
            --verify-tag
            --title "ProviderX $VERSION"
            --notes-file "$RELEASE_NOTES_PATH"
          )
          if [[ "$VERSION" == *-* ]]; then
            release_options+=(--prerelease)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "$DMG_PATH" \
              "$DMG_PATH.sha256" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "$DMG_PATH" \
              "$DMG_PATH.sha256" \
              "${release_options[@]}"
          fi
